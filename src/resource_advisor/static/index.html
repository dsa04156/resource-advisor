<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resource Advisor · 연구실 공동 자원 관리</title>
    <link rel="icon" type="image/svg+xml" href="/console/mark.svg" />
    <link rel="stylesheet" href="/console/console.css" />
    <script type="module" src="/console/console.js"></script>
  </head>
  <body>
    <a href="#main" class="skip">본문으로 이동</a>
    <div class="layout">
      <aside class="sidebar">
        <a href="#execution" class="brand"><span class="brand-mark" aria-hidden="true">▥</span><span>Research Workspace<small>Resource Advisor · GPU / NPU</small></span></a>
        <nav aria-label="작업과 자원 관리">
          <a href="#execution" data-view="execution" aria-current="page"><span>◫</span>자원 현황</a>
          <a href="#jobs" data-view="jobs"><span>≡</span>작업 현황 <b id="nav-job-count" class="nav-count">—</b></a>
          <a href="#submit" data-view="submit"><span>＋</span>새 작업</a>
          <a href="#history" data-view="history"><span>⌘</span>큐 · 사용량</a>
        </nav>
        <nav class="related-nav" aria-label="분석과 검증">
          <p class="eyebrow">ANALYSIS</p>
          <a href="#compatibility" data-view="compatibility"><span>◇</span>가속기 호환성</a>
          <a href="#recommendations" data-view="recommendations"><span>⌁</span>추천 근거 · 결과</a>
        </nav>
        <div class="sidebar-spacer"></div>
        <section class="tenant-card"><span class="connection-dot" aria-hidden="true"></span><div><small>워크스페이스</small><strong id="identity">연결 전</strong></div></section>
        <button id="logout" hidden>연결 해제</button>
      </aside>
      <div class="content-shell">
        <header class="topbar">
          <div><p class="eyebrow" id="section-label">WORKSPACE</p><h1 id="view-title">자원 현황</h1></div>
          <div class="refresh"><small id="updated"></small><label><input id="auto" type="checkbox" checked />15초 자동 갱신</label><button id="refresh" aria-label="지금 갱신" title="지금 갱신">↻</button><a class="action-link" href="#submit">새 작업</a></div>
        </header>
      <main id="main" tabindex="-1">
        <section id="connect" class="connect panel">
          <p class="eyebrow">PROJECT ACCESS</p>
          <h1>연구 자원에 연결</h1>
          <p>프로젝트 토큰으로 자원 현황과 실행 근거를 조회합니다.</p>
          <form id="login" method="post">
            <label for="token">프로젝트 API 토큰</label>
            <div class="form-line">
              <input
                id="token"
                type="password"
                autocomplete="off"
                required
                spellcheck="false"
              /><button type="submit" class="primary">연결</button>
            </div>
          </form>
          <p class="muted">
            토큰은 현재 탭의 메모리에만 유지됩니다. 연결 해제나 새로고침 시 다시
            입력합니다.
          </p>
        </section>
        <div id="notice" role="status" aria-live="polite"></div>
        <div id="workspace" hidden>
          <p id="view-description" class="view-description"></p>
          <div id="content"></div>
        </div>
      </main>
      </div>
    </div>
    <dialog id="job-dialog" aria-labelledby="job-dialog-title">
      <div class="panel-head"><h2 id="job-dialog-title">작업 상세</h2><button id="close-job-dialog" aria-label="상세 닫기">닫기 ×</button></div>
      <div id="job-dialog-body"></div>
    </dialog>
  </body>
</html>
