<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resource Advisor · 연구실 공동 자원 관리</title>
    <link rel="icon" type="image/svg+xml" href="/console/mark.svg" />
    <link rel="stylesheet" href="/console/console.css" />
    <script type="module" src="/console/console.js"></script>
  </head>
  <body>
    <a href="#main" class="skip">본문으로 이동</a>
    <header>
      <a href="/console" class="brand"
        >RA <span>Resource Advisor<small>연구실 공동 자원 관리</small></span></a
      >
      <div id="identity">프로젝트 연결 전</div>
      <button id="logout" hidden>연결 해제</button>
    </header>
    <div class="layout">
      <aside>
        <p class="eyebrow">WORKSPACE</p>
        <nav aria-label="작업과 자원 관리">
          <a href="#submit" data-view="submit"
            ><span>＋</span>작업 제출</a
          >
          <a href="#execution" data-view="execution" aria-current="page"
            ><span>01</span>자원 현황</a
          >
          <a href="#jobs" data-view="jobs"
            ><span>02</span>작업 현황</a
          >
          <a href="#history" data-view="history"
            ><span>03</span>큐 · 사용량</a
          >
          <details class="advanced-nav"><summary>고급 · 검증</summary>
          <a href="#compatibility" data-view="compatibility"
            >가속기 호환성</a>
          <a href="#recommendations" data-view="recommendations"
            >추천 근거 · 결과</a
          >
          </details>
        </nav>
        <p class="aside-note">
          등록된 장비, 예약 여유,<br />검증된 실행환경을 구분합니다.
        </p>
      </aside>
      <main id="main" tabindex="-1">
        <section id="connect" class="connect panel">
          <p class="eyebrow">PROJECT ACCESS</p>
          <h1>연구 자원에 연결</h1>
          <p>프로젝트 토큰으로 자원 현황과 실행 근거를 조회합니다.</p>
          <form id="login" method="post">
            <label for="token">프로젝트 API 토큰</label>
            <div class="form-line">
              <input
                id="token"
                type="password"
                autocomplete="off"
                required
                spellcheck="false"
              /><button type="submit" class="primary">연결</button>
            </div>
          </form>
          <p class="muted">
            토큰은 현재 탭의 메모리에만 유지됩니다. 연결 해제나 새로고침 시 다시
            입력합니다.
          </p>
        </section>
        <div id="notice" role="status" aria-live="polite"></div>
        <div id="workspace" hidden>
          <div class="view-head">
            <div>
              <p class="eyebrow" id="section-label">OBSERVATION</p>
              <h1 id="view-title">실행 현황</h1>
              <p id="view-description"></p>
            </div>
            <div class="refresh">
              <button id="refresh">지금 갱신</button
              ><label
                ><input id="auto" type="checkbox" checked />15초 자동
                갱신</label
              ><small id="updated"></small>
            </div>
          </div>
          <div id="content"></div>
        </div>
      </main>
    </div>
    <dialog id="job-dialog" aria-labelledby="job-dialog-title">
      <div class="panel-head"><h2 id="job-dialog-title">작업 상세</h2><button id="close-job-dialog" aria-label="상세 닫기">닫기 ×</button></div>
      <div id="job-dialog-body"></div>
    </dialog>
  </body>
</html>
