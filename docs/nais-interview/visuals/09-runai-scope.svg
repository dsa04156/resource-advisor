<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs>
    <rect width="1600" height="900" fill="#f5f5f5"/>
    <g font-family="Noto Sans CJK JP,Noto Sans CJK KR,sans-serif"><text x="64" y="64" font-size="16" fill="#4f5d75" font-weight="normal" text-anchor="start">NAIS  /  연구기술직-3  /  면접 설명 자료</text><text x="64" y="124" font-size="40" fill="#2d3142" font-weight="bold" text-anchor="start">비교의 중심은 “어느 운영 계층을 맡는가”</text><text x="64" y="172" font-size="24" fill="#4f5d75" font-weight="normal" text-anchor="start">두 열은 기능 범위 비교이며, 연동이 완료된 배포 구조를 뜻하지 않는다.</text><rect x="64" y="240" width="1472" height="112" rx="8" fill="#fcece4" stroke="#eb6c36" stroke-width="2"/><text x="84" y="276" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">연구자 공통 진입점 · 기관별 정책 연결 · 검증 가능한 결과</text><text x="84" y="312" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">NAIS 목표에 대한 설계 해석: 공동 활용과 기관의 운영 권한을 함께 고려</text><rect x="64" y="404" width="696" height="232" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="84" y="440" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">이 프로젝트</text><text x="84" y="476" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">공통 workload / runtime 계약</text><text x="84" y="508" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">별도 K8s · Slurm adapter와 제출 복구</text><text x="84" y="540" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">결과 품질·identity 검사, 사용량·결과 추적</text><rect x="808" y="404" width="728" height="232" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="828" y="440" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">Run:ai 공식 기능</text><text x="828" y="476" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">Kubernetes 기반 자원 배분·운영</text><text x="828" y="508" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">quota · fair share · priority · preemption</text><text x="828" y="540" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">GPU fractions / sharing, Slurm on K8s 접점</text><text x="64" y="716" font-size="28" fill="#2d3142" font-weight="bold" text-anchor="start">직접 비교 실험 없음</text><text x="568" y="716" font-size="28" fill="#2d3142" font-weight="bold" text-anchor="start">Run:ai adapter 미구현</text><text x="1072" y="716" font-size="28" fill="#2d3142" font-weight="bold" text-anchor="start">우월성 결론 없음</text><line x1="64" y1="804" x2="1536" y2="804" stroke="#bfc0c0"/><text x="64" y="840" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">Run:ai의 NodeSet 지원은 Slurm job/account/partition 전체 관리와 다름  ·  세부 공식 링크는 README</text><text x="64" y="872" font-size="16" fill="#4f5d75" font-weight="normal" text-anchor="start">구현·측정 범위와 출처: 함께 제공한 README.md 및 SOURCE-MATERIAL.md</text></g></svg>
