    <g font-family="Noto Sans CJK JP,Noto Sans CJK KR,sans-serif"><text x="64" y="64" font-size="16" fill="#4f5d75" font-weight="normal" text-anchor="start">NAIS  /  연구기술직-3  /  면접 설명 자료</text><text x="64" y="124" font-size="40" fill="#2d3142" font-weight="bold" text-anchor="start">응답 유실을 “새 작업 제출”로 처리하지 않는다</text><text x="64" y="172" font-size="24" fill="#4f5d75" font-weight="normal" text-anchor="start">실행 전 intent를 저장하고, 불확실한 제출은 같은 attempt의 외부 작업을 찾아 조정한다.</text><line x1="240" y1="284" x2="240" y2="752" stroke="#bfc0c0" stroke-dasharray="8 8"/><line x1="600" y1="284" x2="600" y2="752" stroke="#bfc0c0" stroke-dasharray="8 8"/><line x1="960" y1="284" x2="960" y2="752" stroke="#bfc0c0" stroke-dasharray="8 8"/><line x1="1360" y1="284" x2="1360" y2="752" stroke="#bfc0c0" stroke-dasharray="8 8"/><rect x="108" y="212" width="264" height="72" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="128" y="248" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">API</text><rect x="468" y="212" width="264" height="72" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="488" y="248" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">PostgreSQL</text><rect x="828" y="212" width="264" height="72" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="848" y="248" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">Worker</text><rect x="1228" y="212" width="264" height="72" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="1248" y="248" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">Native scheduler</text><polyline points="240,336 600,336" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="268.0" y="304" width="304" height="28" fill="#f5f5f5"/><text x="420.0" y="324" font-size="20" fill="#2d3142" font-weight="normal" text-anchor="middle">① 요청·멱등 키 저장</text><polyline points="960,408 600,408" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="628.0" y="376" width="304" height="28" fill="#f5f5f5"/><text x="780.0" y="396" font-size="20" fill="#2d3142" font-weight="normal" text-anchor="middle">② 제출 intent 커밋</text><polyline points="960,480 1360,480" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="1008.0" y="448" width="304" height="28" fill="#f5f5f5"/><text x="1160.0" y="468" font-size="20" fill="#2d3142" font-weight="normal" text-anchor="middle">③ 외부 작업 제출</text><polyline points="1360,552 960,552" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="8 8"/><rect x="1008.0" y="520" width="304" height="28" fill="#f5f5f5"/><text x="1160.0" y="540" font-size="20" fill="#2d3142" font-weight="normal" text-anchor="middle">④ 응답 유실 / 결과 불명</text><polyline points="960,624 600,624" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="628.0" y="592" width="304" height="28" fill="#f5f5f5"/><text x="780.0" y="612" font-size="20" fill="#2d3142" font-weight="normal" text-anchor="middle">⑤ UNKNOWN 상태 기록</text><polyline points="960,696 1360,696" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="1008.0" y="664" width="304" height="28" fill="#f5f5f5"/><text x="1160.0" y="684" font-size="20" fill="#2d3142" font-weight="normal" text-anchor="middle">⑥ 같은 attempt를 탐색</text><line x1="64" y1="804" x2="1536" y2="804" stroke="#bfc0c0"/><text x="64" y="840" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">확정할 수 없으면 불확실 상태를 유지  ·  자동 재제출 없음  ·  모든 장애 경로의 live 검증을 뜻하지 않음</text><text x="64" y="872" font-size="16" fill="#4f5d75" font-weight="normal" text-anchor="start">구현·측정 범위와 출처: 함께 제공한 README.md 및 SOURCE-MATERIAL.md</text></g></svg>
