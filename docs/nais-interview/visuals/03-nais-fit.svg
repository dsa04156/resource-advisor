    <g font-family="Noto Sans CJK JP,Noto Sans CJK KR,sans-serif"><text x="64" y="64" font-size="16" fill="#4f5d75" font-weight="normal" text-anchor="start">NAIS  /  연구기술직-3  /  면접 설명 자료</text><text x="64" y="124" font-size="40" fill="#2d3142" font-weight="bold" text-anchor="start">NAIS의 목표 중, 공동 연산 운영 계층을 구현</text><text x="64" y="172" font-size="24" fill="#4f5d75" font-weight="normal" text-anchor="start">왼쪽은 공식 자료의 요약, 가운데는 설계 해석, 오른쪽은 레포에서 확인한 구현이다.</text><text x="64" y="244" font-size="28" fill="#2d3142" font-weight="bold" text-anchor="start">공식 방향</text><text x="568" y="244" font-size="28" fill="#2d3142" font-weight="bold" text-anchor="start">설계 해석</text><text x="1072" y="244" font-size="28" fill="#2d3142" font-weight="bold" text-anchor="start">실습 구현</text><polyline points="496,340 552,340" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1000,340 1056,340" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="280" width="432" height="132" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="84" y="316" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">분산된 연구자원 공동 활용</text><text x="84" y="352" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">데이터·모델·연산을 연결</text><rect x="568" y="280" width="432" height="132" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="588" y="316" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">연구자에게 공통 진입점</text><text x="588" y="352" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">요청 형식과 결과 계약 통일</text><rect x="1072" y="280" width="432" height="132" rx="8" fill="#fcece4" stroke="#eb6c36" stroke-width="2"/><text x="1092" y="316" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">공통 API + 두 adapter</text><text x="1092" y="352" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">Kubernetes / 별도 Slurm</text><polyline points="496,504 552,504" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1000,504 1056,504" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="444" width="432" height="132" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="84" y="480" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">기관별 우선순위 자율성</text><text x="84" y="516" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">공동 기반과 기관 역할 분담</text><rect x="568" y="444" width="432" height="132" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="588" y="480" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">정책 권한을 현장에 유지</text><text x="588" y="516" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">통합 계층은 정책을 매핑</text><rect x="1072" y="444" width="432" height="132" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="1092" y="480" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">normal / high 매핑</text><text x="1092" y="516" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">Kueue priority · Slurm QOS</text><polyline points="496,668 552,668" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1000,668 1056,668" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="608" width="432" height="132" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="84" y="644" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">연구 생산성과 자산 재사용</text><text x="84" y="680" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">연구 지원 기반의 운영</text><rect x="568" y="608" width="432" height="132" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="588" y="644" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">결과·환경·사용량 추적</text><text x="588" y="680" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">성공과 품질 통과를 구분</text><rect x="1072" y="608" width="432" height="132" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="1092" y="644" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">결과 검증 + usage ledger</text><text x="1092" y="680" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">PostgreSQL · S3 · MLflow</text><line x1="64" y1="804" x2="1536" y2="804" stroke="#bfc0c0"/><text x="64" y="840" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">기관 연합 완성 아님  ·  SSO·기관 간 망·AMD·클라우드 운영은 별도 과제</text><text x="64" y="872" font-size="16" fill="#4f5d75" font-weight="normal" text-anchor="start">구현·측정 범위와 출처: 함께 제공한 README.md 및 SOURCE-MATERIAL.md</text></g></svg>
