    <g font-family="Noto Sans CJK JP,Noto Sans CJK KR,sans-serif"><text x="64" y="64" font-size="16" fill="#4f5d75" font-weight="normal" text-anchor="start">NAIS  /  연구기술직-3  /  면접 설명 자료</text><text x="64" y="124" font-size="40" fill="#2d3142" font-weight="bold" text-anchor="start">서로 다른 스케줄러를 공통 실행 계약으로 연결</text><text x="64" y="172" font-size="24" fill="#4f5d75" font-weight="normal" text-anchor="start">요청과 결과 형식을 통일하고, 배치 결정은 각 클러스터의 기존 스케줄러에 맡긴다.</text><polyline points="324,332 420,332" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="552,396 552,484" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="684,332 736,332 736,268 800,268" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="736,332 736,484 800,484" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1080,268 1160,268" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1080,484 1160,484" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1300,332 1512,332 1512,656 1080,656" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="1300,548 1464,548 1464,656 1080,656" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="800,656 684,656" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><polyline points="552,612 552,596" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/><rect x="64" y="268" width="260" height="128" rx="8" fill="#fcece4" stroke="#eb6c36" stroke-width="2"/><text x="84" y="304" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">공통 API</text><text x="84" y="340" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">인증 · 불변 작업 계약</text><text x="84" y="372" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">멱등 키로 요청 식별</text><rect x="420" y="268" width="264" height="128" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="440" y="304" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">Worker / route</text><text x="440" y="340" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">project × cluster</text><text x="440" y="372" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">제출 · 관측 · 조정</text><rect x="420" y="484" width="264" height="112" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="440" y="520" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">PostgreSQL</text><text x="440" y="556" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">작업 상태 · 제출 intent</text><rect x="800" y="204" width="280" height="128" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="820" y="240" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">Kubernetes adapter</text><text x="820" y="276" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">suspended Job 생성</text><text x="820" y="308" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">queue / priority 라벨</text><rect x="1160" y="204" width="280" height="128" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="1180" y="240" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">Kueue + K8s</text><text x="1180" y="276" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">admission · 노드 배치</text><text x="1180" y="308" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="start">기존 스케줄러</text><rect x="800" y="420" width="280" height="128" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="820" y="456" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">Slurm adapter</text><text x="820" y="492" font-size="20" fill="#4f5d75" font-weight="normal" text-anchor="star