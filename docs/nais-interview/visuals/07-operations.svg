    <g font-family="Noto Sans CJK JP,Noto Sans CJK KR,sans-serif"><text x="64" y="64" font-size="16" fill="#4f5d75" font-weight="normal" text-anchor="start">NAIS  /  연구기술직-3  /  면접 설명 자료</text><text x="64" y="124" font-size="40" fill="#2d3142" font-weight="bold" text-anchor="start">운영 역량은 정책 집행과 복구 기록으로 설명</text><text x="64" y="172" font-size="24" fill="#4f5d75" font-weight="normal" text-anchor="start">Slurm 정책: 2026-10-02 · DB·서비스 JSON은 정확한 실행 날짜 필드 없음</text><text x="64" y="248" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">검증 항목</text><text x="480" y="248" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">실제 기록</text><text x="1040" y="248" font-size="24" fill="#2d3142" font-weight="bold" text-anchor="start">주장의 경계</text><line x1="64" y1="344" x2="1536" y2="344" stroke="#d9dce1"/><text x="64" y="312" font-size="24" fill="#2d3142" font-weight="normal" text-anchor="start">Slurm 정책 집행</text><text x="480" y="312" font-size="24" fill="#2d3142" font-weight="normal" text-anchor="start">CPU2 · 2 GiB · 3분 요청 거절</text><text x="1040" y="312" font-size="24" fill="#4f5d75" font-weight="normal" text-anchor="start">다중 사용자 공정성·선점 아님</text><line x1="64" y1="432" x2="1536" y2="432" stroke="#d9dce1"/><text x="64" y="400" font-size="24" fill="#2d3142" font-weight="normal" text-anchor="start">작업 우선순위</text><text x="480" y="400" font-size="24" fill="#2d3142" font-weight="normal" text-anchor="start">high가 normal보다 3초 먼저 시작</text><text x="1040" y="400" font-size="24" fill="#4f5d75" font-weight="normal" text-anchor="start">한 번의 대기 작업 순서 검증</text><line x1="64" y1="520" x2="1536" y2="520" stroke="#d9dce1"/><text x="64" y="488" font-size="24" fill="#2d3142" font-weight="normal" text-anchor="start">DB 복사·Pod 교체</text><text x="480" y="488" font-size="24" fill="#2d3142" font-weight="normal" text-anchor="start">5개 테이블 내용 지문 일치</text><text x="1040" y="488" font-size="24" fill="#4f5d75" font-weight="normal" text-anchor="start">노드·디스크 소실 복구 아님</text><line x1