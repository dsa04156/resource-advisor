<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">Kubernetes: 관측 경로와 실행 경로</title><desc id="desc">API·메트릭을 공통 상태로 정규화한다. Kueue는 Admission, kube-scheduler는 Pod 배치를 담당한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2e5aa8"/></marker></defs><rect width="1920" height="1080" fill="#f5f5f5"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="64" y="76" font-size="20" fill="#4f5d75" font-weight="400">RESOURCE ADVISOR / 02</text><text x="64" y="140" font-size="44" fill="#2d3142" font-weight="700">Kubernetes: 관측 경로와 실행 경로</text><text x="64" y="188" font-size="24" fill="#4f5d75" font-weight="400">API·메트릭을 공통 상태로 정규화한다. Kueue는 Admission, kube-scheduler는 Pod 배치를 담당한다.</text><text x="64" y="252" font-size="24" fill="#2e5aa8" font-weight="700">현재 연결된 관측 경로</text><polyline points="624,376 744,376" fill="none" stroke="#2e5aa8" stroke-width="3"/><polygon points="744,376 724.0,386.0 724.0,366.0" fill="#2e5aa8"/><polyline points="1160,376 1280,376" fill="none" stroke="#2e5aa8" stroke-width="3"/><polygon points="1280,376 1260.0,386.0 1260.0,366.0" fill="#2e5aa8"/><rect x="64" y="288" width="560" height="176" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="88" y="336" font-size="32" fill="#2d3142" font-weight="700">Kubernetes API · Prometheus</text><text x="88" y="376" font-size="24" fill="#4f5d75" font-weight="400">Node / Pod / Queue 상태</text><text x="88" y="412" font-size="24" fill="#4f5d75" font-weight="400">GPU·NPU·Jetson exporter 메트릭</text><rect x="744" y="288" width="416" height="176" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="768" y="336" font-size="32" fill="#2d3142" font-weight="700">Inventory Collector</text><text x="768" y="376" font-size="24" fill="#4f5d75" font-weight="400">자원 단위 · 출처 · 관측 시각</text><text x="768" y="412" font-size="24" fill="#4f5d75" font-weight="400">미측정 unknown / 오래되면 stale</text><rect x="1280" y="288" width="576" height="176" rx="8" fill="#fcece4" stroke="#eb6c36" stroke-width="2"/><text x="1304" y="336" font-size="32" fill="#2d3142" font-weight="700">공통 DB · 자원 화면</text><text x="1304" y="376" font-size="24" fill="#4f5d75" font-weight="400">물리 GPU / 논리 슬롯 구분</text><text x="1304" y="412" font-size="24" fill="#4f5d75" font-weight="400">할당량과 실제 사용률을 분리</text><text x="64" y="592" font-size="24" fill="#2e5aa8" font-weight="700">코드로 구현된 실행 경로 — 이번 문서 작업에서 새 Job 실행·복구 실증은 하지 않음</text><polyline points="480,736 600,736" fill="none" stroke="#2e5aa8" stroke-width="3" stroke-dasharray="10 8"/><polygon points="600,736 580.0,746.0 580.0,726.0" fill="#2e5aa8"/><polyline points="936,736 1056,736" fill="none" stroke="#2e5aa8" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1056,736 1036.0,746.0 1036.0,726.0" fill="#2e5aa8"/><polyline points="1392,736 1512,736" fill="none" stroke="#2e5aa8" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1512,736 1492.0,746.0 1492.0,726.0" fill="#2e5aa8"/><rect x="64" y="648" width="416" height="176" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="88" y="696" font-size="32" fill="#2d3142" font-weight="700">Worker · K8s Adapter</text><text x="88" y="736" font-size="24" fill="#4f5d75" font-weight="400">Job 생성 · hostname 제약</text><text x="88" y="772" font-size="24" fill="#4f5d75" font-weight="400">후보 노드를 nodeSelector로 고정</text><rect x="600" y="648" width="336" height="176" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="624" y="696" font-size="32" fill="#2d3142" font-weight="700">Kueue</text><text x="624" y="736" font-size="24" fill="#4f5d75" font-weight="400">Quota / Admission</text><text x="624" y="772" font-size="24" fill="#4f5d75" font-weight="400">승인 전 suspend</text><rect x="1056" y="648" width="336" height="176" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="1080" y="696" font-size="32" fill="#2d3142" font-weight="700">kube-scheduler</text><text x="1080" y="736" font-size="24" fill="#4f5d75" font-weight="400">nodeSelector 제약 확인</text><text x="1080" y="772" font-size="24" fill="#4f5d75" font-weight="400">제약 안에서 최종 bind</text><rect x="1512" y="648" width="344" height="176" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="1536" y="696" font-size="32" fill="#2d3142" font-weight="700">kubelet · 실행</text><text x="1536" y="736" font-size="24" fill="#4f5d75" font-weight="400">GPU / NPU Job</text><text x="1536" y="772" font-size="24" fill="#4f5d75" font-weight="400">상태 · 결과 수집</text><text x="64" y="888" font-size="24" fill="#4f5d75" font-weight="400">현재 RA는 후보 노드를 hostname으로 고정한다. 자원풀만 지정하고 노드를 위임하는 방식은 향후 개선 항목이다.</text><text x="64" y="932" font-size="24" fill="#4f5d75" font-weight="400">Kueue Admission과 kube-scheduler 최종 bind는 유지한다. KAI 연계·전역 GPU 예약은 검증 범위 밖이다.</text><path d="M64 988 H1856" stroke="#cbd0d8"/><text x="64" y="1024" font-size="20" fill="#4f5d75" font-weight="400">흰색: 자체 구현 · 회색: 기존 오픈소스 · 실선: 현재 관측 · 점선: 구현된 실행 흐름(이번 신규 실증 없음)</text><text x="64" y="1056" font-size="20" fill="#4f5d75" font-weight="400">출처: 소스 코드 · 2026-10-29 관측 스냅샷 · Slurm 배포 증거 / 성능 측정 결과가 아님</text></g></svg>