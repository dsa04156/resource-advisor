<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">가상 Slurm: SSH 관측·회계 연결</title><desc id="desc">SSH 22 → forced-command → docker exec. 공개 포트 16817 → 6817은 어댑터 연결에 사용하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2e5aa8"/></marker></defs><rect width="1920" height="1080" fill="#f5f5f5"/><g font-family="Noto Sans CJK KR, sans-serif"><text x="64" y="76" font-size="20" fill="#4f5d75" font-weight="400">RESOURCE ADVISOR / 03</text><text x="64" y="140" font-size="44" fill="#2d3142" font-weight="700">가상 Slurm: SSH 관측·회계 연결</text><text x="64" y="188" font-size="24" fill="#4f5d75" font-weight="400">SSH 22 → forced-command → docker exec. 공개 포트 16817 → 6817은 어댑터 연결에 사용하지 않는다.</text><polyline points="480,336 592,336" fill="none" stroke="#2e5aa8" stroke-width="3"/><polygon points="592,336 572.0,346.0 572.0,326.0" fill="#2e5aa8"/><polyline points="1056,336 1200,336" fill="none" stroke="#2e5aa8" stroke-width="3"/><polygon points="1200,336 1180.0,346.0 1180.0,326.0" fill="#2e5aa8"/><polyline points="480,624 536,624 536,400 592,400" fill="none" stroke="#2e5aa8" stroke-width="3"/><polygon points="592,400 572.0,410.0 572.0,390.0" fill="#2e5aa8"/><polyline points="1528,424 1528,536" fill="none" stroke="#2e5aa8" stroke-width="3" stroke-dasharray="10 8"/><polygon points="1528,536 1518.0,516.0 1538.0,516.0" fill="#2e5aa8"/><polyline points="1200,392 1120,392 1120,624 1056,624" fill="none" stroke="#2e5aa8" stroke-width="3"/><polygon points="1056,624 1076.0,614.0 1076.0,634.0" fill="#2e5aa8"/><rect x="1128" y="480" width="72" height="32" fill="#f5f5f5"/><text x="1136" y="504" font-size="20" fill="#2e5aa8" font-weight="400">6819</text><polyline points="824,712 824,804" fill="none" stroke="#2e5aa8" stroke-width="3"/><polygon points="824,804 814.0,784.0 834.0,784.0" fill="#2e5aa8"/><rect x="840" y="744" width="72" height="32" fill="#f5f5f5"/><text x="848" y="768" font-size="20" fill="#2e5aa8" font-weight="400">3306</text><rect x="64" y="248" width="416" height="176" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="88" y="296" font-size="32" fill="#2d3142" font-weight="700">관측 전용 수집기</text><text x="88" y="336" font-size="24" fill="#4f5d75" font-weight="400">scontrol / squeue JSON</text><text x="88" y="372" font-size="24" fill="#4f5d75" font-weight="400">ra-lab 계정 범위 조회</text><rect x="592" y="248" width="464" height="176" rx="8" fill="#fcece4" stroke="#eb6c36" stroke-width="2"/><text x="616" y="296" font-size="32" fill="#2d3142" font-weight="700">SSH Forced-command</text><text x="616" y="336" font-size="24" fill="#4f5d75" font-weight="400">키 분리 · 명령 허용 목록</text><text x="616" y="372" font-size="24" fill="#4f5d75" font-weight="400">고정 host key · 출발지 제한</text><rect x="1200" y="248" width="656" height="176" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="1224" y="296" font-size="32" fill="#2d3142" font-weight="700">slurmctld 24.11.5</text><text x="1224" y="336" font-size="24" fill="#4f5d75" font-weight="400">Docker 컨테이너의 sim 클러스터</text><text x="1224" y="372" font-size="24" fill="#4f5d75" font-weight="400">호스트 native Slurm과 분리</text><rect x="64" y="536" width="416" height="176" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="2"/><text x="88" y="584" font-size="32" fill="#2d3142" font-weight="700">실행 어댑터·전용 키</text><text x="88" y="624" font-size="24" fill="#4f5d75" font-weight="400">squeue / sacct 조회 검증</text><text x="88" y="660" font-size="24" fill="#4f5d75" font-weight="400">제출 route 미등록·worker 미배포</text><rect x="592" y="536" width="464" height="176" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="616" y="584" font-size="32" fill="#2d3142" font-weight="700">SlurmDBD 24.11.5</text><text x="616" y="624" font-size="24" fill="#4f5d75" font-weight="400">회계 조회 · 계정 association</text><text x="616" y="660" font-size="24" fill="#4f5d75" font-weight="400">sacct 가능 / 신규 Job 행 0</text><rect x="1200" y="536" width="656" height="176" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="1224" y="584" font-size="32" fill="#2d3142" font-weight="700">slurmd 컨테이너 6개</text><text x="1224" y="624" font-size="24" fill="#4f5d75" font-weight="400">가상 GPU 슬롯 8개 (4 / 2 / 1 / 1)</text><text x="1224" y="660" font-size="24" fill="#4f5d75" font-weight="400">실제 GPU 연산·성능 검증 없음</text><rect x="592" y="804" width="464" height="136" rx="8" fill="#e9ebee" stroke="#4f5d75" stroke-width="2"/><text x="616" y="852" font-size="32" fill="#2d3142" font-weight="700">MariaDB 11.8.9</text><text x="616" y="892" font-size="24" fill="#4f5d75" font-weight="400">내부 Docker망 · 영속 볼륨</text><text x="1200" y="852" font-size="24" fill="#4f5d75" font-weight="400">회계 DB는 호스트 포트를 공개하지 않음</text><text x="1200" y="892" font-size="24" fill="#4f5d75" font-weight="400">신뢰된 Docker 운영 계정의 명령 경계</text><text x="1200" y="932" font-size="24" fill="#4f5d75" font-weight="400">멀티테넌트·root 격리를 입증한 것은 아님</text><path d="M64 988 H1856" stroke="#cbd0d8"/><text x="64" y="1024" font-size="20" fill="#4f5d75" font-weight="400">실선: 연결/조회 확인 · 점선: Slurm 고유 실행 관계(이번 작업 제출 0건) · 가상 슬롯 ≠ 물리 GPU</text><text x="64" y="1056" font-size="20" fill="#4f5d75" font-weight="400">출처: 소스 코드 · 2026-10-29 관측 스냅샷 · Slurm 배포 증거 / 성능 측정 결과가 아님</text></g></svg>