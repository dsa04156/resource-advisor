name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: ra_test_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisor -d ra_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
      - run: uv sync --locked --extra pipelines --extra optimizer --extra artifacts
      - run: uv run ruff check src tests examples
      - run: uv run ruff format --check src tests examples
      - run: node --check src/resource_advisor/static/console.js
      - run: uv build --wheel
      - name: Verify console assets are packaged
        run: |
          uv run python - <<'PY'
          import glob, zipfile
          with zipfile.ZipFile(glob.glob("dist/*.whl")[0]) as wheel:
              files = set(wheel.namelist())
              for asset in ("index.html", "console.js", "console.css", "mark.svg"):
                  assert "resource_advisor/static/" + asset in files
          PY
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          RA_TEST_DATABASE_URL: postgresql+psycopg://advisor:ci-ephemeral-only@localhost:5432/ra_test_ci
