# Separate read-only grant; the existing ra-worker Role is not modified.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ra-live-kueue-reader
  namespace: resource-advisor-lab
  labels: {app.kubernetes.io/part-of: resource-advisor}
rules:
- apiGroups: [kueue.x-k8s.io]
  resources: [workloads]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ra-live-kueue-reader
  namespace: resource-advisor-lab
  labels: {app.kubernetes.io/part-of: resource-advisor}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: ra-live-kueue-reader}
subjects:
- {kind: ServiceAccount, name: ra-worker, namespace: resource-advisor-lab}
