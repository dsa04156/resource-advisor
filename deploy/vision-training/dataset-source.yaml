# Staged-training dataset source: serves the deterministic tar baked into the vision image
# (/opt/ra-train/vision-dataset-v1.tar) over plain HTTP from etri-ser0001. NodePort with
# externalTrafficPolicy Local, so every node (including KubeEdge Orin) reaches it at
# 10.254.192.47:30817 and the bytes always leave ser0001: a fixed, declared source endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ra-vt-dataset-source
  namespace: ra-vision-training
  labels: {app.kubernetes.io/part-of: ra-vision-training, app.kubernetes.io/name: ra-vt-dataset-source}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ra-vt-dataset-source}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: ra-vision-training, app.kubernetes.io/name: ra-vt-dataset-source}
    spec:
      nodeSelector: {kubernetes.io/hostname: etri-ser0001-cg0msb}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: http
        image: 10.254.192.47:5000/resource-advisor/vision-training@sha256:ca838c00c937f7d1463e968a58d703ce718a6285ca8377f729ef17ee53142c2b
        command: [python3, -I, -m, http.server, '8080', --bind, 0.0.0.0, --directory, /opt/ra-train]
        ports: [{name: http, containerPort: 8080}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: '1', memory: 256Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        readinessProbe:
          tcpSocket: {port: 8080}
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ra-vt-dataset-source
  namespace: ra-vision-training
  labels: {app.kubernetes.io/part-of: ra-vision-training}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: ra-vt-dataset-source}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30817}]
