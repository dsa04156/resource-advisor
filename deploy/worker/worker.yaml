# Zero replicas until explicit route/image qualification; runtime Jobs are not GitOps resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ra-worker
  labels:
    app.kubernetes.io/part-of: resource-advisor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ra-worker
  labels:
    app.kubernetes.io/part-of: resource-advisor
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ra-worker
  labels:
    app.kubernetes.io/part-of: resource-advisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ra-worker
subjects:
- kind: ServiceAccount
  name: ra-worker
  namespace: resource-advisor-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ra-worker
  labels: &id001
    app.kubernetes.io/name: ra-worker
    app.kubernetes.io/part-of: resource-advisor
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ra-worker
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: amd64
        resource-advisor.io/services: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: example.invalid/resource-advisor/worker:site-must-pin-digest
        command:
        - python
        - -m
        - resource_advisor.cli
        args:
        - worker
        - --config
        - /config/worker.json
        - --heartbeat-path
        - /tmp/heartbeat
        env:
        - name: RA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ra-service-db
              key: url
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        - name: OMP_NUM_THREADS
          value: '1'
        - name: MKL_NUM_THREADS
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python
            - -m
            - resource_advisor.cli
            - check-heartbeat
            - --path
            - /tmp/heartbeat
            - --max-age
            - '300'
          periodSeconds: 10
          timeoutSeconds: 5
        envFrom:
        - secretRef:
            name: ra-artifact-client
      volumes:
      - name: config
        secret:
          secretName: ra-worker-config
          defaultMode: 288
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      serviceAccountName: ra-worker
