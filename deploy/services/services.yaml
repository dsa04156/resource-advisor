# Static control services only; runtime compute Jobs are excluded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ra-api
  labels: &id001
    app.kubernetes.io/name: ra-api
    app.kubernetes.io/part-of: resource-advisor
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ra-api
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64
        resource-advisor.io/services: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: example.invalid/resource-advisor/services:site-must-pin-digest
        command:
        - python
        - -m
        - resource_advisor.cli
        args:
        - serve
        - --credentials
        - /config/credentials.json
        - --host
        - 0.0.0.0
        - --port
        - '8443'
        - --ssl-keyfile
        - /tls/tls.key
        - --ssl-certfile
        - /tls/tls.crt
        - --artifacts-config
        - /config/artifacts.json
        env:
        - name: RA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ra-service-db
              key: url
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tls
          mountPath: /tls
          readOnly: true
        envFrom:
        - secretRef:
            name: ra-artifact-client
        ports:
        - name: https
          containerPort: 8443
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: config
        secret:
          secretName: ra-api-config
          defaultMode: 288
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: tls
        secret:
          secretName: ra-api-tls
          defaultMode: 288
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ra-inventory
  labels: &id001
    app.kubernetes.io/name: ra-inventory
    app.kubernetes.io/part-of: resource-advisor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ra-inventory
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/arch: amd64
        resource-advisor.io/services: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: inventory
        image: example.invalid/resource-advisor/services:site-must-pin-digest
        command:
        - python
        - -m
        - resource_advisor.cli
        args:
        - collect-inventory
        - --config
        - /config/inventory.json
        - --interval-seconds
        - '30'
        - --heartbeat-path
        - /tmp/heartbeat
        env:
        - name: RA_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ra-service-db
              key: url
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python
            - -m
            - resource_advisor.cli
            - check-heartbeat
            - --path
            - /tmp/heartbeat
            - --max-age
            - '120'
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: config
        secret:
          secretName: ra-inventory-config
          defaultMode: 288
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      serviceAccountName: ra-inventory
---
apiVersion: v1
kind: Service
metadata:
  name: ra-api
  labels:
    app.kubernetes.io/part-of: resource-advisor
spec:
  selector:
    app.kubernetes.io/name: ra-api
  ports:
  - name: https
    port: 8443
    targetPort: https
