[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "resource-advisor"
version = "0.1.0"
description = "Evidence-bound resource recommendation and execution contracts"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
optimizer = ["botorch>=0.15,<0.17", "torch>=2.8,<2.9"]
pipelines = [
    "kfp>=2.5,<3",
    "kfp-kubernetes>=1.3,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
resource-advisor = "resource_advisor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE"]

[tool.ruff.lint.per-file-ignores]
"src/resource_advisor/api.py" = ["B008"] # FastAPI's documented dependency declarations

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "optimizer", marker = "sys_platform == 'linux'" }]
